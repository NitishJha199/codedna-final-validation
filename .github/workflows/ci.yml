name: CodeDNA Final Validation CI

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sbom:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service:
          - order-api
          - inventory-api

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate CycloneDX SBOM
        run: |
          python -m pip install --upgrade pip
          pip install cyclonedx-bom
          cyclonedx-py requirements \
            "services/${{ matrix.service }}/requirements.txt" \
            --output-format JSON \
            --output-file sbom.json

      - name: Upload CodeDNA SBOM
        uses: actions/upload-artifact@v4
        with:
          name: codedna-sbom-${{ matrix.service }}
          path: sbom.json
          retention-days: 7
