name: CodeDNA Final Validation Deployment

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  deployments: write

jobs:
  deployment-evidence:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service:
          - order-api
          - inventory-api

    steps:
      - uses: actions/checkout@v4

      - name: Create successful GitHub deployment evidence
        uses: actions/github-script@v7
        with:
          script: |
            const service = "${{ matrix.service }}";

            const deployment = await github.rest.repos.createDeployment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: context.sha,
              environment: `${service}:validation`,
              auto_merge: false,
              required_contexts: [],
              description: `CodeDNA final validation deployment for ${service}`,
              transient_environment: false,
              production_environment: false
            });

            await github.rest.repos.createDeploymentStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              deployment_id: deployment.data.id,
              state: "success",
              environment: `${service}:validation`,
              description: "CodeDNA final validation deployment succeeded"
            });
